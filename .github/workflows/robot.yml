# Robot che comprime le registrazioni su Cloudflare R2 e scompatta gli ZIP importati dal vecchio Drive.
# Gira da solo ogni ora (gratis per i repository pubblici); si può avviare a mano da Actions → Robot → Run workflow.
# Secrets necessari (Settings → Secrets and variables → Actions):
#   SERVICE_TOKEN (codice di servizio, sito → Amministrazione), R2_ACCOUNT_ID, R2_KEY_ID, R2_APP_KEY, R2_BUCKET
name: Robot compressione registrazioni

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: robot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  comprimi:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Controllo configurazione
        id: cfg
        env:
          SERVICE_TOKEN: ${{ secrets.SERVICE_TOKEN }}
        run: |
          if [ -z "$SERVICE_TOKEN" ]; then
            echo "Robot non ancora configurato: aggiungi i Secrets (vedi README)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.cfg.outputs.ready == 'true'
      - uses: actions/setup-python@v6
        if: steps.cfg.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: Installa ffmpeg e boto3
        if: steps.cfg.outputs.ready == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          python -m pip install -q boto3
      - name: Comprimi le registrazioni
        if: steps.cfg.outputs.ready == 'true'
        env:
          SUPABASE_URL: https://bbyaljjyjfhufesjxycf.supabase.co
          SUPABASE_KEY: sb_publishable_i2fK_GSxrDxBBXTLZrnccQ_5Ct0ml8F
          SERVICE_TOKEN: ${{ secrets.SERVICE_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_KEY_ID: ${{ secrets.R2_KEY_ID }}
          R2_APP_KEY: ${{ secrets.R2_APP_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TIME_BUDGET_MIN: '300'
        run: python drive-import/robot.py
