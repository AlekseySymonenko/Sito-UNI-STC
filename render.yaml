# Configurazione per la pubblicazione su Render.com ("Blueprint").
# Su Render: New → Blueprint → scegli questo repository.
services:
  - type: web
    name: elearning-bicocca
    runtime: node
    plan: starter            # serve un piano a pagamento per avere il disco permanente
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /login
    disk:
      name: dati
      mountPath: /var/data   # database e file caricati
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.13.1"
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: UNIVERSITY_NAME
        value: Università degli Studi di Milano-Bicocca
      - key: UNIVERSITY_SHORT_NAME
        value: Bicocca
      - key: PLATFORM_NAME
        value: e-Learning
      - key: DISCLAIMER
        value: Progetto studentesco non ufficiale
      - key: ALLOWED_EMAIL_DOMAINS
        value: campus.unimib.it
      - key: AUTH_MODE
        value: oidc
      - key: OIDC_ISSUER
        value: https://accounts.google.com
      - key: OIDC_HOSTED_DOMAIN
        value: campus.unimib.it
      - key: OIDC_PROVIDER_LABEL
        value: l'account @campus.unimib.it
      # Da compilare a mano su Render (non vanno scritti nel codice):
      - key: OIDC_CLIENT_ID
        sync: false
      - key: OIDC_CLIENT_SECRET
        sync: false
      - key: OIDC_REDIRECT_URI
        sync: false
      - key: ADMIN_EMAILS
        sync: false
